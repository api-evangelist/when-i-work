- aid: when-i-work:when-i-work-schedules-locations-api
  name: When I Work Schedules (Locations) API
  description: >-
    Schedules are logical groupings of users that are working together. Schedules can be physical offices
    with addresses or logical groups like departments. Users can be tagged (associated) to one or more
    schedules. Schedules can be departments, facilities, business divisions or any grouping of staff.


