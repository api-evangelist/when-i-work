- aid: when-i-work:when-i-work-import-api
  name: When I Work Import API
  description: >-
    The import API is used to import a variety of When I Work resources from user-provided CSV or Excel
    files.


    ### Import Types


    All available import types and their columns are listed here. Where possible, the column names will
    align with names used elsewhere in the API, but this is not always possible.


    <table>
       <thead>
         <tr>
           <th>type</th>
           <th>columns</th>
           <th>required?</th>
           <th>notes</th>
         </tr>
       </thead>
       <tbody>
         <tr>
           <td rowspan="5" class="nowrap"><code>SHIFT_TEMPLATE</code></td>
           <td>start_time</td>
           <td>✅</td>
           <td></td>
         </tr>
         <tr>
           <td>end_time</td>
           <td>✅</td>
           <td></td>
         </tr>
         <tr>
           <td>schedule</td>
           <td></td>
           <td>
             <p>A schedule name to associate with the shift template. If no schedule with that name exists,
    a new schedule will be created.</p>
             <p>If omitted, the shift template will be assigned to all schedules (or the value "All Schedules"
    can be provided to do the same).</p>
           </td>
         </tr>
         <tr>
           <td>position</td>
           <td></td>
           <td>
             <p>A position name to associate with the shift template. If no position with that name exists,
    a new position will be created.</p>
           </td>
         </tr>
         <tr>
           <td>unpaid_break</td>
           <td></td>
           <td>The length of the unpaid break in minutes.</td>
         </tr>
         <tr>
           <td rowspan="12" class="nowrap"><code>EMPLOYEE</code></td>
           <td>first_name</td>
           <td>✅</td>
           <td>First name of the employee</td>
         </tr>
         <tr>
           <td>last_name</td>
           <td>✅</td>
           <td>Last name of the employee</td>
         </tr>
         <tr>
           <td>email</td>
           <td></td>
           <td>The email address of the employee</td>
         </tr>
         <tr>
           <td>employee_code</td>
           <td></td>
           <td>The employee code to associate with the employee</td>
         </tr>
         <tr>
           <td>file_number</td>
           <td></td>
           <td>The file number corresponding to the employee in ADP</td>
         </tr>
         <tr>
           <td>id</td>
           <td></td>
           <td>The user id corresponding to the employee in When I Work</td>
         </tr>
         <tr>
           <td>location</td>
           <td></td>
           <td>
             <p>A schedule (location) name to associate with the employee. If no schedule with that name
    exists, a new schedule will be created.</p>
           </td>
         </tr>
         <tr>
           <td>max</td>
           <td></td>
           <td>The maximum hours per week of the employee</td>
         </tr>
         <tr>
           <td>phone</td>
           <td></td>
           <td>The phone number of the employee</td>
         </tr>
         <tr>
           <td>position</td>
           <td></td>
           <td>
             <p>A position name to associate with the employee. If no position with that name exists,
    a new position will be created.</p>
           </td>
         </tr>
         <tr>
           <td>tags</td>
           <td></td>
           <td>
             <p>A comma separated list of tags to associate to the employee. If the tag does not exist,
    it will be created.</p>
           </td>
         </tr>
         <tr>
           <td>wage</td>
           <td></td>
           <td>
