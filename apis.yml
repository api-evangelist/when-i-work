- aid: when-i-work:when-i-work-shift-breaks-api
  name: When I Work Shift Breaks API
  description: >-
    Two types of breaks are provided. First; Scheduled Shift Breaks are break records associated with
    scheduled shifts. Second; Shift Breaks are break records associated with time worked.

    For Shift Breaks (Attendance)
       Three types of records are possible from a break action or automated action
       A record can be created from a user break punch allocation
       A record can be created from a Manager/Supervisor edit to a timesheet. (With this type of record,
    no break time is generated and only the length is available to be queried.)
       A Break record can be created via the system configuration setting for Auto-Deduct of Breaks. (With
    this type of record, no break time is generated and only the length is available to be queried.)

       Note: This endpoint requires the request header for w-userid.
       For more information about managing Breaks, visit the [Help Center](https://help.wheniwork.com/articles/attendance-settings/)
