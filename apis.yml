- aid: when-i-work:when-i-work-annotations-api
  name: When I Work Annotations API
  description: >-
    Annotations convey important information to all staff for the given schedules (locations) and date
    range.


    Any or none of the following tags may apply to an Annotation:


    * Time Off Not Allowed

    * Business Closed

    * Announcement


    The "Time Off Not Allowed" tag is the only tag that affects the behavior of another API. Time Off
    requests will be considered invalid if the request's date range overlaps an Annotation of the "Time
    Off Not Allowed" type for the user's location(s).


    For more on using Annotations, visit the [Help Center](https://help.wheniwork.com/hc/en-us/articles/204348065-Annotations).
