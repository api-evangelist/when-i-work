  name: When I Work Sites API
  description: >-
    Sites communicate additional information about a given shift to the recipient. Typical usage is when
    you schedule employees for shifts that are at different physical sites (addresses) compared to the
    Schedule where the shift is assigned. A Job site can include additional detail (address or coordinates)
    that informs the user where this particular shift is to take place. An additional use case would be
    if you want to use an additional labor reporting tier and having the Job Site be a project or cost
    center value.

