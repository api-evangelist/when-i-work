- aid: when-i-work:when-i-work-punch-api
  name: When I Work Punch API
  description: >-
    A punch is an event where a user clocks in or clocks out. Punches can be managed to restrict where
    an employee can clock in/out and from what devices.


    If a user forgets to clock out, they will be allowed to clock in after 9 hours from the end of their
    scheduled shift. If there is no scheduled shift, the user can clock in again after 18 hours from when
    they originally clocked in.
