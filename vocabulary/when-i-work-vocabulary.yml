  schemas:
  - name: BaseScheduledBreak
    description: ''
    properties:
    - name: id
      description: ID of the break. Provide in the request when updating an existing break.
    - name: account_id
      description: ''
    - name: length
      description: The length of the break (seconds).
    - name: paid
      description: Whether the break is a paid rest break (true) or unpaid meal break (false)
    - name: sort
      description: Breaks are sorted by start time if it is available. If no start time is provided, breaks are sorted by
        their position in the request. In a mixed list, breaks without a start time keep their original position, while breaks
        with a start time are sorted amongst themselves.
    - name: created_at
      description: Date and time the break was created at.
    - name: created_by
      description: The id of the user who created the break.
    - name: updated_at
      description: Date and time the break was last updated.
    - name: updated_by
      description: The id of the user who last edited the break.
  - name: Shift
    description: ''
    properties:
    - name: id
      description: ''
    - name: account_id
      description: ''
    - name: user_id
      description: The user assigned to the shift. Set to `0` for an Open Shift.
    - name: location_id
      description: Location the shift belongs to
    - name: position_id
      description: ''
    - name: site_id
      description: ''
    - name: start_time
      description: ''
    - name: end_time
      description: ''
    - name: break_time
      description: Length of the unpaid breaks for the shift in hours.
    - name: breaks
      description: An array of breaks for the shift. When updating a shift, any existing breaks for the shift that are not
        included in the request will be deleted.
  - name: ShiftChain
    description: ''
    properties:
    - name: key
      description: ''
    - name: rrule
      description: The RFC5545-compliant RRule representing the shift chain.
    - name: until
      description: The date when the shift chain ends.
    - name: week
      description: Represents the week frequency interval. `1` means weekly, `2` means every two weeks, etc.
    - name: weekdays
      description: 'A bitmask of the weekdays which shifts in this chain occur on. In a seven-bit binary number, the most

        significant bit represents Sunday and the least significant bit represents Monday (0b1000001).


        Examples:

        | Days                      | Binary      | Decimal |

        |---------------------------|-------------|---------|

        | Monday through Friday     | `0b0011111` | 31      |

        | Monday, Wednesday, Friday | `0b0010101` | 21      |

        | Saturday and Sunday       | `0b1100000` | 96      |

        '
    - name: timezone_id
      description: The timezone this chain is built in
    - name: count
      description: The number of shifts created by this chain.
  - name: Chain
    description: ''
    properties:
    - name: until
      description: 'The date you want the recurrence to end on. It must be in UTC, such that when shifted to the provided

        timezone (see `timezone_id` below) the time will be midnight in a local time.


        Example: You''re creating a shift chain in the `America/Chicago` timezone that you want to end on 7/29/24

        locally. You would send `2024-07-29T05:00:00Z`, which when converted to the provided timezone would be

        `2024-07-29T00:00:00-05:00`.


        **NOTE**: This is required when _creating_ a repeating shift. It may be omitted when editing one.

        '
    - name: week
      description: 'Represents the week frequency interval. `1` means weekly, `2` means every two weeks, etc.


        **NOTE**: This is required when _creating_ a repeating shift. It may be omitted when editing one.

        '
    - name: weekdays
      description: 'A bitmask of the weekdays which shifts in this chain occur on. In a seven-bit binary number, the most

        significant bit represents Sunday and the least significant bit represents Monday (0b1000001).


        Examples:

        | Days                      | Binary      | Decimal |

        |---------------------------|-------------|---------|

        | Monday through Friday     | `0b0011111` | 31      |

        | Monday, Wednesday, Friday | `0b0010101` | 21      |

        | Saturday and Sunday       | `0b1100000` | 96      |

        '
    - name: timezone_id
      description: 'The timezone this chain is built in.


        This must be either the `timezone_id` or `olson_id` from one of the timezones available through

        [this endpoint](#tag/Timezones).

        '
  - name: V2Error
    description: ''
    properties:
    - name: error
      description: A description of the specific error
    - name: code
      description: The API error code
  - name: Time
    description: ''
    properties:
    - name: id
      description: The time id
    - name: account_id
      description: The account id
    - name: user_id
      description: The user assigned to the time.
    - name: creator_id
      description: The user that created the time.
    - name: position_id
      description: Position the time belongs to. 0 if unassigned.
    - name: location_id
      description: Location the time belongs to. 0 if unassigned.
    - name: site_id
      description: Site the time belongs to. 0 if unassigned.
    - name: shift_id
      description: A shift tied to this time. 0 if unassigned.
    - name: start_time
      description: The start time
    - name: end_time
      description: The end time
  - name: User
    description: ''
    properties:
    - name: account_id
      description: ID of the primary account for this user.
    - name: activated
      description: Whether the manager has activated this user.
    - name: email
      description: The email address of this user.
    - name: employee_code
      description: 'The user''s employee code. This code can be used to clock in instead of

        the user''s email address, or it can be used to help map users in When

        I Work to other services.

        '
    - name: first_name
      description: The first name of this user.
    - name: hourly_rate
      description: 'The base hourly rate for this user. The user can have additional wages

        based on the position they are working at the time. There is no currency

        attached, so customers are expected to input correct values for their

        currency or do their own conversion from USD.

        '
    - name: hours_max
      description: 'The max hours that this user prefers to work. A manager may still

        schedule the user beyond this value.

        '
    - name: hours_preferred
      description: The preferred number of hours for this user to work.
    - name: id
      description: Unique identifier for the user.
    - name: is_deleted
      description: Whether the user has been deleted.
  - name: PunchResponse
    description: ''
    properties:
    - name: time
      description: The Time object that the punch is associated with
    - name: overtime_alert
      description: Was an over-time alert triggered
    - name: user
      description: The User that has punched in
    - name: punches
      description: 'Array of punches associated with the current Time

        * Punch in/out

        * Punch break start/stop

        '
  - name: OpenShiftApprovalRequestUser
    description: ''
    properties:
    - name: id
      description: The ID of the OpenShift Approval Request
    - name: user_id
      description: The ID of the user that raised their hand for this request
    - name: created_at
      description: ''
    - name: deleted_at
      description: ''
  - name: OpenShiftApprovalRequest
    description: ''
    properties:
    - name: id
      description: The ID of the OpenShift Approval Request
    - name: account_id
      description: The ID of the account that this OpenShift Approval Request belongs to
    - name: shift_id
      description: The ID of the shift that this OpenShift Approval Request is for
    - name: shift
      description: ''
    - name: creator_id
      description: The ID of the user that created this request
    - name: updater_id
      description: The ID of the user that last updated this request
    - name: status
      description: The current status of the OpenShift Approval Request.
    - name: user_status
      description: Copy of the status field to mirror the data model of other request types
    - name: is_shared
      description: Is this approval request shared across schedules
    - name: created_at
      description: ''
  - name: ShiftHistory
    description: ''
    properties:
    - name: type
      description: The type of history event
    - name: attributes
      description: ''
  - name: ShiftBulk
    description: ''
    properties:
    - name: id
      description: ''
    - name: account_id
      description: ''
    - name: user_id
      description: The user assigned to the shift. Set to `0` for an Open Shift.
    - name: location_id
      description: Location the shift belongs to
    - name: position_id
      description: ''
    - name: site_id
      description: ''
    - name: start_time
      description: ''
    - name: end_time
      description: ''
    - name: break_time
      description: ''
    - name: color
      description: Assign color to shift
